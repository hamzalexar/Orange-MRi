<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOT Worklog – Nieuw wachtwoord</title>
  <meta name="description" content="Stel een nieuw wachtwoord in voor je account." />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <style>
    .login-wrap{
      min-height: calc(100vh - 70px);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .login-panel{
      width:100%;
      max-width:360px;
      padding:24px;
    }
    .login-panel h1{
      font-size:18px;
      margin:0 0 4px 0;
    }
    .login-panel .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:14px;
    }
    .login-panel .field span{
      font-size:12px;
      color:var(--muted);
      font-weight:600;
    }
    .login-panel .btn.primary{
      width:100%;
      justify-content:center;
      margin-top:18px;
      height:38px;
    }
    .login-links{
      margin-top:14px;
      font-size:13px;
    }
    .login-links a{
      color: var(--accent);
      text-decoration:none;
    }
    .login-links a:hover{ text-decoration:underline; }
    .login-error{
      color:var(--danger);
      font-size:13px;
      margin-top:10px;
      display:none;
    }
    .login-success{
      color:#067647;
      font-size:13px;
      margin-top:10px;
      display:none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="title">BOT Cable MRI</div>
        <div class="subtitle">Worklog tool</div>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <section class="panel login-panel" id="resetPanel" hidden>
      <h1>Nieuw wachtwoord instellen</h1>

      <form id="resetForm" autocomplete="on">
        <label class="field">
          <span>Nieuw wachtwoord</span>
          <input class="input" id="password" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label class="field">
          <span>Herhaal wachtwoord</span>
          <input class="input" id="passwordConfirm" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <button class="btn primary" id="saveBtn" type="submit">Wachtwoord opslaan</button>
        <div class="login-error" id="errorMsg"></div>
        <div class="login-success" id="successMsg"></div>
      </form>
    </section>

    <section class="panel login-panel" id="invalidPanel" hidden>
      <h1>Link ongeldig of verlopen</h1>
      <div class="muted">Vraag een nieuwe reset-link aan.</div>
      <div class="login-links">
        <a href="forgot-password.html">Nieuwe link aanvragen</a>
      </div>
    </section>
  </div>

  <script type="module" src="./assets/js/app-reset-password.js"></script>
</body>
</html>
