<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOT Worklog – Stats</title>

  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/stats.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body>
  <div class="stats-page">

    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <div class="title">BOT Cable MRI</div>
          <div class="subtitle">Worklog tool</div>
        </div>
      </div>

      <nav class="nav">
        <a href="index.html" class="nav-link" data-page="worklog">Worklog</a>
        <a href="cases.html" class="nav-link" data-page="cases">Cases</a>
        <a href="stats.html" class="nav-link active" data-page="stats">Stats</a>
        <a href="followups.html" class="nav-link" data-page="followups">Follow-ups</a>
        <a href="incidents.html" class="nav-link" data-page="incidents">Incidents</a>
        <button class="btn ghost" id="signOutBtn" type="button">Sign out</button>

      </nav>
    </header>

    <main class="container">
      <section class="dash">

        <!-- KPI row -->
        <div class="kpi-row">
          <div class="kpi-card">
            <div class="kpi-title">Total cases</div>
            <div class="kpi-value" id="totalCases">0</div>
            <div class="muted" id="totalSub">—</div>
          </div>

          <div class="kpi-card inbound">
            <div class="kpi-title">Inbound</div>
            <div class="kpi-value" id="inboundCases">0</div>
            <div class="muted" id="inboundSub">—</div>
          </div>

          <div class="kpi-card outbound">
            <div class="kpi-title">Outbound</div>
            <div class="kpi-value" id="outboundCases">0</div>
            <div class="muted" id="outboundSub">—</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-title">Customers called</div>
            <div class="kpi-value" id="calledCustomers">0</div>
            <div class="muted" id="calledSub">—</div>
          </div>

          <div class="kpi-card incidents">
            <div class="kpi-title">Incidents</div>
            <div class="kpi-value" id="incidentCount">0</div>
            <div class="muted" id="incidentSub">—</div>
          </div>
        </div>

        <!-- Body: sidebar + main -->
        <div class="dash-body">

          <!-- Sidebar filters -->
          <aside class="side">
            <div class="panel">
              <div class="panel-head">
                <div>
                  <div class="panel-title">Filters</div>
                  <div class="muted" id="rangeLabel">—</div>
                </div>
              </div>

              <div class="panel-body">
                <div class="field">
                  <span class="muted">Period</span>
                  <div class="segmented" id="periodSegmented" role="tablist">
                    <button type="button" class="segmented-btn" data-period="day" role="tab">Day</button>
                    <button type="button" class="segmented-btn" data-period="month" role="tab">Month</button>
                    <button type="button" class="segmented-btn" data-period="year" role="tab">Year</button>
                  </div>
                </div>

                <div class="field" id="dayPickerWrap">
                  <label class="muted" for="dayPicker">Day</label>
                  <input class="input" id="dayPicker" type="date" />
                </div>

                <div class="field" id="monthPickerWrap" style="display:none;">
                  <span class="muted">Month</span>
                  <div class="month-select-row">
                    <select class="input" id="monthMonthSelect"></select>
                    <select class="input" id="monthYearSelect"></select>
                  </div>
                </div>

                <div class="field" id="yearPickerWrap" style="display:none;">
                  <label class="muted" for="yearPicker">Year</label>
                  <select class="input" id="yearPicker"></select>
                </div>

                <div style="display:flex; gap:10px; margin-top:10px;">
                  <button class="btn" id="btnToday" type="button" style="flex:1;">Today</button>
                </div>

                <div class="mini-card" style="margin-top:14px;">
                  <div class="mini-title">Outbound call rate</div>
                  <div class="mini-row">
                    <div class="mini-bar">
                      <div class="mini-bar-fill" id="callRateBar" style="width:0%"></div>
                    </div>
                    <div class="mini-right" id="callRateLabel">0%</div>
                  </div>
                  <div class="muted" id="callRateSub">—</div>
                </div>
              </div>
            </div>
          </aside>

          <!-- Main grid -->
          <section class="main">
            <div class="toolbar">
              <select class="input" id="taskFilter">
                <option value="all">All tasks</option>
              </select>
              <select class="input" id="flowFilter">
                <option value="all">All</option>
                <option value="inbound">Inbound</option>
                <option value="outbound">Outbound</option>
              </select>
            </div>

            <div class="grid2">
              <div class="panel">
                <div class="panel-head">
                  <div class="panel-title">Cases per hour</div>
                </div>
                <div class="panel-body">
                  <div class="chart-wrap"><canvas id="chartHour"></canvas></div>
                </div>
              </div>

              <div class="panel">
                <div class="panel-head">
                  <div class="panel-title">Cases per day</div>
                </div>
                <div class="panel-body">
                  <div class="chart-wrap"><canvas id="chartDay"></canvas></div>
                </div>
              </div>
            </div>

            <div class="grid2" style="margin-top:14px;">
              <div class="panel">
                <div class="panel-head">
                  <div class="panel-title">Cases per week</div>
                </div>
                <div class="panel-body">
                  <div class="chart-wrap"><canvas id="chartWeek"></canvas></div>
                </div>
              </div>

              <div class="panel">
                <div class="panel-head">
                  <div class="panel-title">Cases per month</div>
                </div>
                <div class="panel-body">
                  <div class="chart-wrap"><canvas id="chartMonth"></canvas></div>
                </div>
              </div>
            </div>

            <div class="panel" style="margin-top:14px;">
              <div class="panel-head">
                <div class="panel-title">Incidents per day</div>
              </div>
              <div class="panel-body">
                <div class="chart-wrap"><canvas id="chartIncidents"></canvas></div>
              </div>
            </div>
          </section>

        </div>
      </section>
    </main>

  </div>

  <script type="module" src="./assets/js/app-stats.js?v=20260904"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</body>
</html>
