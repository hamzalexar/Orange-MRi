<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOT Worklog – Login</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <style>
    .login-wrap{
      min-height: calc(100vh - 70px);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .login-panel{
      width:100%;
      max-width:360px;
      padding:24px;
    }
    .login-panel h1{
      font-size:18px;
      margin:0 0 4px 0;
    }
    .login-panel .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:14px;
    }
    .login-panel .field span{
      font-size:12px;
      color:var(--muted);
      font-weight:600;
    }
    .login-panel .btn.primary{
      width:100%;
      justify-content:center;
      margin-top:18px;
      height:38px;
    }
    .login-links{
      display:flex;
      justify-content:space-between;
      margin-top:14px;
      font-size:13px;
    }
    .login-links a{
      color: var(--accent);
      text-decoration:none;
      cursor:pointer;
    }
    .login-links a:hover{ text-decoration:underline; }
    .login-error{
      color:var(--danger);
      font-size:13px;
      margin-top:10px;
      display:none;
    }
    .login-success{
      color:#067647;
      font-size:13px;
      margin-top:10px;
      display:none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="title">BOT Cable MRI</div>
        <div class="subtitle">Worklog tool</div>
      </div>
    </div>
  </header>

  <div class="login-wrap">
    <section class="panel login-panel" id="signinPanel">
      <h1>Inloggen</h1>
      <div class="muted">Log in met je account om je worklog te gebruiken.</div>

      <form id="loginForm" autocomplete="on">
        <label class="field">
          <span>E-mail</span>
          <input class="input" id="email" type="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Wachtwoord</span>
          <input class="input" id="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" id="loginBtn" type="submit">Inloggen</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-links">
        <a id="showSignupLink">Nog geen account? Registreren</a>
        <a href="forgot-password.html">Wachtwoord vergeten?</a>
      </div>
    </section>

    <section class="panel login-panel" id="signupPanel" hidden>
      <h1>Account aanmaken</h1>
      <div class="muted">Vraag de toegangscode aan iemand die al toegang heeft.</div>

      <form id="signupForm" autocomplete="on">
        <label class="field">
          <span>E-mail</span>
          <input class="input" id="signupEmail" type="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Wachtwoord</span>
          <input class="input" id="signupPassword" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label class="field">
          <span>Herhaal wachtwoord</span>
          <input class="input" id="signupPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required />
        </label>
        <label class="field">
          <span>Toegangscode</span>
          <input class="input" id="signupAccessCode" type="text" required />
        </label>
        <button class="btn primary" id="signupBtn" type="submit">Account aanmaken</button>
        <div class="login-error" id="signupError"></div>
        <div class="login-success" id="signupSuccess"></div>
      </form>

      <div class="login-links">
        <a id="showSigninLink">Heb je al een account? Inloggen</a>
        <span></span>
      </div>
    </section>
  </div>

  <script type="module" src="./assets/js/app-login.js"></script>
</body>
</html>
